[project]
name = "stream-patterns"
version = "0.1.0"
description = "Streaming data modeling patterns for Apache Flink and Kafka"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = [
  "apache-flink==2.2.1",
  "hypothesis==6.170.8",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "testcontainers[kafka]==4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streampatterns"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
