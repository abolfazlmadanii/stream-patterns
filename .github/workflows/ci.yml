name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink-version:
          - "2.2.1"
          - "2.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify with Flink ${{ matrix.flink-version }}
        continue-on-error: ${{ matrix.flink-version == '2.3.0' }}
        run: mvn -B verify -Dflink.version=${{ matrix.flink-version }}
